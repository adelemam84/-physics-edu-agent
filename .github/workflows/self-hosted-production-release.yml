name: Self-hosted Production Release

on:
  push:
    branches: [main]
    paths:
      - .release/self-hosted-production.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-edu-agent-self-hosted-production
  cancel-in-progress: true

jobs:
  release:
    name: Verify and promote from self-hosted runner
    runs-on: self-hosted
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout exact release commit
        shell: powershell
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          git config --global --add safe.directory $env:GITHUB_WORKSPACE

          if (-not (Test-Path ".git")) {
            git init .
            git remote add origin "https://github.com/$env:RELEASE_REPOSITORY.git"
          } elseif (-not (git remote | Select-String -SimpleMatch "origin")) {
            git remote add origin "https://github.com/$env:RELEASE_REPOSITORY.git"
          } else {
            git remote set-url origin "https://github.com/$env:RELEASE_REPOSITORY.git"
          }

          $env:GIT_CONFIG_COUNT = "1"
          $env:GIT_CONFIG_KEY_0 = "http.https://github.com/.extraheader"
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: bearer $env:RELEASE_TOKEN"

          git fetch --force --no-tags --prune --depth=2 origin $env:RELEASE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git checkout --force -B main $env:RELEASE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git reset --hard $env:RELEASE_SHA
          git clean -ffdx

          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:RELEASE_SHA) {
            throw "Release checkout drift: expected $env:RELEASE_SHA but got $actual"
          }

          Remove-Item Env:GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
          Remove-Item Env:GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
          Remove-Item Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install runtime dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve Git Bash
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles\Git\bin\bash.exe",
            "$env:ProgramFiles\Git\usr\bin\bash.exe",
            "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe"
          )
          $cmd = Get-Command bash.exe -ErrorAction SilentlyContinue
          if ($cmd) { $candidates += $cmd.Source }
          $bash = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $bash) { throw "Git Bash was not found on the Windows self-hosted runner." }
          "GIT_BASH=$bash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $bash --version

      - name: Run controlled fresh production release
        shell: powershell
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          & $env:GIT_BASH tools/manual_production_release.sh --expected-sha $env:GITHUB_SHA --promote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run post-release technical readiness gate
        shell: powershell
        env:
          TECH_READY_BASE_URL: https://physics-edu-agent.vercel.app
          TECH_READY_TIMEOUT_SECONDS: "8"
          TECH_READY_ATTEMPTS: "2"
          TECH_READY_MAX_LATENCY_MS: "5000"
          TECH_READY_EXPECT_CONTENT_INGESTION_LOCKED: "true"
          TECH_READY_OUTPUT: technical-readiness-results.json
        run: |
          $version = python -c "from app.version import APPLICATION_VERSION; print(APPLICATION_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TECH_READY_EXPECT_VERSION = $version.Trim()
          python tools/technical_readiness_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload post-release readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-release-technical-readiness-${{ github.run_id }}
          path: technical-readiness-results.json
          if-no-files-found: warn
          retention-days: 30
