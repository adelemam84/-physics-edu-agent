name: Final Technical Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "status.py"
      - "app/content_phase_guard.py"
      - "app/security.py"
      - "app/student_security.py"
      - "app/student_session_api.py"
      - "app/services/rate_limit.py"
      - "app/whatsapp_webhook.py"
      - "app/services/ai_governance.py"
      - "app/services/ai_orchestrator.py"
      - "tools/technical_readiness_probe.py"
      - "tests/test_technical_readiness_probe_contract.py"
      - "tests/test_lightweight_status_plane.py"
      - ".github/workflows/final-technical-readiness.yml"
  push:
    branches: [main]
    paths:
      - "status.py"
      - "app/content_phase_guard.py"
      - "app/security.py"
      - "app/student_security.py"
      - "app/student_session_api.py"
      - "app/services/rate_limit.py"
      - "app/whatsapp_webhook.py"
      - "app/services/ai_governance.py"
      - "app/services/ai_orchestrator.py"
      - "tools/technical_readiness_probe.py"
      - "tests/test_technical_readiness_probe_contract.py"
      - "tests/test_lightweight_status_plane.py"
      - ".github/workflows/final-technical-readiness.yml"
  schedule:
    - cron: "43 2 * * *"

permissions:
  contents: read

concurrency:
  group: physics-edu-agent-final-technical-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Production technical readiness contract
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      TECH_READY_BASE_URL: https://physics-edu-agent.vercel.app
      TECH_READY_TIMEOUT_SECONDS: "8"
      TECH_READY_ATTEMPTS: "2"
      TECH_READY_MAX_LATENCY_MS: "5000"
      TECH_READY_EXPECT_CONTENT_INGESTION_LOCKED: "true"
    steps:
      - name: Materialize exact workflow source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const workspace = process.env.GITHUB_WORKSPACE;
            for (const entry of fs.readdirSync(workspace)) {
              fs.rmSync(path.join(workspace, entry), {
                recursive: true,
                force: true,
                maxRetries: 5,
                retryDelay: 250,
              });
            }
            const env = {
              ...process.env,
              GIT_CONFIG_COUNT: '1',
              GIT_CONFIG_KEY_0: 'http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_0: 'AUTHORIZATION: bearer ' + process.env.SOURCE_TOKEN,
            };
            await exec.exec('git', ['init', workspace], {env});
            await exec.exec('git', ['-C', workspace, 'remote', 'add', 'origin',
              'https://github.com/' + process.env.SOURCE_REPOSITORY + '.git'], {env});
            await exec.exec('git', ['-C', workspace, 'fetch', '--depth=1', 'origin',
              process.env.SOURCE_SHA], {env});
            await exec.exec('git', ['-C', workspace, 'checkout', '--detach', 'FETCH_HEAD'], {env});
            if (!fs.existsSync(path.join(workspace, 'requirements.txt')) ||
                !fs.existsSync(path.join(workspace, 'index.py'))) {
              core.setFailed('Exact source materialization did not produce the expected repository files.');
            }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve expected production version
        shell: powershell
        run: |
          $version = python -c "from app.version import APPLICATION_VERSION; print(APPLICATION_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TECH_READY_EXPECT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run final technical readiness gate
        shell: powershell
        run: |
          python tools/technical_readiness_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-technical-readiness-${{ github.run_id }}
          path: technical-readiness-results.json
          if-no-files-found: error
          retention-days: 30
