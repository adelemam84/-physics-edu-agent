name: Execute EDU-001 and EDU-003\n\non:\n  workflow_dispatch:\n  push:\n    branches: [main]\n    paths:\n      - ".maintenance/execute-edu001-edu003.json"\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: physics-edu-agent-content-maintenance\n  cancel-in-progress: false\n\nenv:\n  VERCEL_ORG_ID: team_GsqjHJAXTirB3YVlUto63rma\n  VERCEL_PROJECT_ID: prj_YVuUR2a1VFpZQwdXmUwTRpGbE1sL\n  VERCEL_CLI_VERSION: 59.17.0\n\njobs:\n  execute:\n    name: Source coverage and visual transcription assistance\n    runs-on: ubuntu-latest\n    environment: production\n    timeout-minutes: 45\n    steps:\n      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0\n        with:\n          python-version: "3.12"\n      - name: Install runtime dependencies\n        run: python -m pip install --disable-pip-version-check -r requirements.txt\n      - name: Set up Node\n        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0\n        with:\n          node-version: "24"\n      - name: Install pinned Vercel CLI\n        run: npm install --global "vercel@$VERCEL_CLI_VERSION"\n      - name: Pull production configuration\n        env:\n          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}\n        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"\n      - name: Execute controlled content maintenance\n        run: |\n          set -euo pipefail\n          set -a\n          source .vercel/.env.production.local\n          set +a\n          export CONTENT_INGESTION_ENABLED=true\n          python tools/run_edu001_edu003_maintenance.py\n      - name: Upload maintenance evidence\n        if: always()\n        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1\n        with:\n          name: edu001-edu003-maintenance-${{ github.run_id }}\n          path: edu001-edu003-maintenance-results.json\n          if-no-files-found: warn\n          retention-days: 30\n