name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q app index.py
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
