name: Final Technical Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "status.py"
      - "app/content_phase_guard.py"
      - "app/security.py"
      - "app/student_security.py"
      - "app/student_session_api.py"
      - "app/services/rate_limit.py"
      - "app/whatsapp_webhook.py"
      - "app/services/ai_governance.py"
      - "app/services/ai_orchestrator.py"
      - "tools/technical_readiness_probe.py"
      - "tests/test_technical_readiness_probe_contract.py"
      - "tests/test_lightweight_status_plane.py"
      - ".github/workflows/final-technical-readiness.yml"
  push:
    branches: [main]
    paths:
      - "status.py"
      - "app/content_phase_guard.py"
      - "app/security.py"
      - "app/student_security.py"
      - "app/student_session_api.py"
      - "app/services/rate_limit.py"
      - "app/whatsapp_webhook.py"
      - "app/services/ai_governance.py"
      - "app/services/ai_orchestrator.py"
      - "tools/technical_readiness_probe.py"
      - "tests/test_technical_readiness_probe_contract.py"
      - "tests/test_lightweight_status_plane.py"
      - ".github/workflows/final-technical-readiness.yml"
  schedule:
    - cron: "43 2 * * *"

permissions:
  contents: read

concurrency:
  group: physics-edu-agent-final-technical-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Production technical readiness contract
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      TECH_READY_BASE_URL: https://physics-edu-agent.vercel.app
      TECH_READY_TIMEOUT_SECONDS: "8"
      TECH_READY_ATTEMPTS: "2"
      TECH_READY_MAX_LATENCY_MS: "5000"
      TECH_READY_EXPECT_CONTENT_INGESTION_LOCKED: "true"
    steps:
      - name: Materialize exact workflow source
        shell: powershell
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "physics-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.zip"
          $extract = Join-Path $env:RUNNER_TEMP "physics-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null

          $url = "https://api.github.com/repos/$env:SOURCE_REPOSITORY/zipball/$env:SOURCE_SHA"
          & curl.exe --fail --location --silent --show-error --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 `
            -H "Authorization: Bearer $env:SOURCE_TOKEN" `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2022-11-28" `
            -o $archive $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if (-not $root) { throw "GitHub archive did not contain a source root." }

          Get-ChildItem -Force -Path $env:GITHUB_WORKSPACE | Remove-Item -Recurse -Force -ErrorAction Stop
          Get-ChildItem -Force -Path $root.FullName | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $env:GITHUB_WORKSPACE -Recurse -Force
          }

          if (-not (Test-Path "requirements.txt")) { throw "Workflow archive is missing requirements.txt" }
          if (-not (Test-Path "index.py")) { throw "Workflow archive is missing index.py" }
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve expected production version
        shell: powershell
        run: |
          $version = python -c "from app.version import APPLICATION_VERSION; print(APPLICATION_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TECH_READY_EXPECT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run final technical readiness gate
        shell: powershell
        run: |
          python tools/technical_readiness_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-technical-readiness-${{ github.run_id }}
          path: technical-readiness-results.json
          if-no-files-found: error
          retention-days: 30
