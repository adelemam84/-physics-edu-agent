name: Temporary Lesson Pack 1.8.9 Bump
on:
  push:
    branches: [work/lesson-pack-1.8.9]
    paths: [.github/workflows/_temporary_release_189.yml]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: work/lesson-pack-1.8.9
      - name: Bump version and route contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/version.py')
          t=p.read_text()
          assert 'APPLICATION_VERSION = "1.8.8"' in t
          p.write_text(t.replace('APPLICATION_VERSION = "1.8.8"','APPLICATION_VERSION = "1.8.9"'))
          p=Path('tests/test_app_import.py')
          t=p.read_text()
          assert 'self.assertEqual(self._app().version, "1.8.8")' in t
          t=t.replace('self.assertEqual(self._app().version, "1.8.8")','self.assertEqual(self._app().version, "1.8.9")')
          anchor='''            "/api/admin/lesson-pack-studio/jobs/{job_id}/preview-pdf",\n            "/api/admin/lesson-pack-studio/jobs/{job_id}/export-pdf",'''
          assert anchor in t
          t=t.replace(anchor,'''            "/api/admin/lesson-pack-studio/jobs/{job_id}/preview-pdf",\n            "/api/admin/lesson-pack-studio/jobs/{job_id}/cover",\n            "/api/admin/lesson-pack-studio/jobs/{job_id}/preview-manifest",\n            "/api/admin/lesson-pack-studio/jobs/{job_id}/preview-page/{page_number}",\n            "/api/admin/lesson-pack-studio/jobs/{job_id}/export-pdf",''')
          p.write_text(t)
          PY
      - name: Commit release bump
        shell: bash
        run: |
          rm .github/workflows/_temporary_release_189.yml
          git config user.name "lesson-pack-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release Lesson Pack cover preview as 1.8.9"
          git push origin HEAD:work/lesson-pack-1.8.9
