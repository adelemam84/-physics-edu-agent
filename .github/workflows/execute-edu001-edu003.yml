name: Execute EDU-001 and EDU-003

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".maintenance/execute-edu001-edu003.json"
      - "tools/manual_content_maintenance.sh"
      - ".github/workflows/execute-edu001-edu003.yml"

permissions:
  contents: read

concurrency:
  group: physics-edu-agent-content-maintenance
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_GsqjHJAXTirB3YVlUto63rma
  VERCEL_PROJECT_ID: prj_YVuUR2a1VFpZQwdXmUwTRpGbE1sL
  VERCEL_CLI_VERSION: 59.17.0

jobs:
  execute:
    if: github.event_name == 'workflow_dispatch'
    name: Staged source coverage and visual transcription assistance
    runs-on: self-hosted
    environment: production
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          clean: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Resolve Git Bash
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles\Git\bin\bash.exe",
            "$env:ProgramFiles\Git\usr\bin\bash.exe",
            "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe"
          )
          $cmd = Get-Command bash.exe -ErrorAction SilentlyContinue
          if ($cmd) { $candidates += $cmd.Source }
          $bash = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $bash) { throw "Git Bash was not found on the Windows self-hosted runner." }
          "GIT_BASH=$bash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $bash --version

      - name: Run hardened zero-cost EDU maintenance
        shell: powershell
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          & $env:GIT_BASH tools/manual_content_maintenance.sh --expected-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
