name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".release/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/self-hosted-runner-diagnostics.yml"
      - ".runner/diagnostic-trigger.json"
      - ".github/workflows/self-hosted-runner-repair.yml"
      - ".runner/repair-trigger.json"
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app index.py
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run complete pytest suite
        run: python -m pytest -q tests
      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit pinned runtime requirements
        run: python -m pip_audit -r requirements.txt --progress-spinner off
