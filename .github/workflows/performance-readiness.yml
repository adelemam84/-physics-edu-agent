name: Production Performance Readiness

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Controlled Production Release"]
    types: [completed]
  push:
    paths:
      - ".github/workflows/performance-readiness.yml"
      - "tools/performance_probe.py"
      - "tests/test_performance_probe_contract.py"
      - ".performance/probe.json"

permissions:
  contents: read

concurrency:
  group: physics-edu-agent-performance-readiness
  cancel-in-progress: false

jobs:
  safe-read-only-probe:
    name: Safe read-only production probe
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PERF_BASE_URL: https://physics-edu-agent.vercel.app
      PERF_REQUESTS: "100"
      PERF_CONCURRENCY: "10"
      PERF_TIMEOUT_SECONDS: "10"
      PERF_MAX_ERROR_RATE: "0.01"
      PERF_P95_LIMIT_MS: "2500"
      PERF_MAX_LIMIT_MS: "8000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run bounded read-only performance probe
        run: python tools/performance_probe.py

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-performance-readiness
          path: performance-results.json
          if-no-files-found: error
          retention-days: 14
