name: Self-hosted Production Release

on:
  push:
    branches: [main]
    paths:
      - .release/self-hosted-production.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A single self-hosted runner uses a shared _temp directory. Keep every
  # self-hosted workflow in one non-cancelling group so an old Worker cannot
  # delete runner command files while the next job is starting.
  group: physics-edu-agent-self-hosted
  cancel-in-progress: false

jobs:
  release:
    name: Verify and promote from self-hosted runner
    runs-on: self-hosted
    environment: production
    timeout-minutes: 45
    steps:
      - name: Materialize exact release commit archive
        shell: powershell
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "physics-release-source.zip"
          $extract = Join-Path $env:RUNNER_TEMP "physics-release-source"
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null

          $url = "https://api.github.com/repos/$env:RELEASE_REPOSITORY/zipball/$env:RELEASE_SHA"
          & curl.exe --fail --location --silent --show-error --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 `
            -H "Authorization: Bearer $env:RELEASE_TOKEN" `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2022-11-28" `
            -o $archive $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if (-not $root) { throw "GitHub release archive did not contain a source root." }

          Get-ChildItem -Force -Path $env:GITHUB_WORKSPACE | Remove-Item -Recurse -Force -ErrorAction Stop
          Get-ChildItem -Force -Path $root.FullName | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $env:GITHUB_WORKSPACE -Recurse -Force
          }

          if (-not (Test-Path "tools/manual_production_release.sh")) {
            throw "Release archive is missing tools/manual_production_release.sh"
          }
          if (-not (Test-Path ".release/self-hosted-production.json")) {
            throw "Release archive is missing the production marker"
          }

          git init . | Out-Null
          git config --global --add safe.directory $env:GITHUB_WORKSPACE
          "RELEASE_SOURCE_SHA=$env:RELEASE_SHA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SOURCE_REF=main" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install runtime dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve Git Bash
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles\Git\bin\bash.exe",
            "$env:ProgramFiles\Git\usr\bin\bash.exe",
            "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe"
          )
          $cmd = Get-Command bash.exe -ErrorAction SilentlyContinue
          if ($cmd) { $candidates += $cmd.Source }
          $bash = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $bash) { throw "Git Bash was not found on the Windows self-hosted runner." }
          "GIT_BASH=$bash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $bash --version

      - name: Run controlled fresh production release
        shell: powershell
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          & $env:GIT_BASH tools/manual_production_release.sh --expected-sha $env:GITHUB_SHA --promote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run post-release technical readiness gate
        shell: powershell
        env:
          TECH_READY_BASE_URL: https://physics-edu-agent.vercel.app
          TECH_READY_TIMEOUT_SECONDS: "8"
          TECH_READY_ATTEMPTS: "2"
          TECH_READY_MAX_LATENCY_MS: "5000"
          TECH_READY_EXPECT_CONTENT_INGESTION_LOCKED: "true"
          TECH_READY_OUTPUT: technical-readiness-results.json
        run: |
          $version = python -c "from app.version import APPLICATION_VERSION; print(APPLICATION_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TECH_READY_EXPECT_VERSION = $version.Trim()
          python tools/technical_readiness_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload post-release readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-release-technical-readiness-${{ github.run_id }}
          path: technical-readiness-results.json
          if-no-files-found: warn
          retention-days: 30
