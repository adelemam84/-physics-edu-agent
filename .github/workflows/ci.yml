name: CI

concurrency:
  group: physics-edu-agent-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - ".release/**"
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: self-hosted
    env:
      PSExecutionPolicyPreference: Bypass
    steps:
      - name: Materialize exact workflow source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const workspace = process.env.GITHUB_WORKSPACE;
            for (const entry of fs.readdirSync(workspace)) {
              fs.rmSync(path.join(workspace, entry), {
                recursive: true,
                force: true,
                maxRetries: 5,
                retryDelay: 250,
              });
            }
            const env = {
              ...process.env,
              GIT_CONFIG_COUNT: '1',
              GIT_CONFIG_KEY_0: 'http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_0: 'AUTHORIZATION: bearer ' + process.env.SOURCE_TOKEN,
            };
            await exec.exec('git', ['init', workspace], {env});
            await exec.exec('git', ['-C', workspace, 'remote', 'add', 'origin',
              'https://github.com/' + process.env.SOURCE_REPOSITORY + '.git'], {env});
            await exec.exec('git', ['-C', workspace, 'fetch', '--depth=1', 'origin',
              process.env.SOURCE_SHA], {env});
            await exec.exec('git', ['-C', workspace, 'checkout', '--detach', 'FETCH_HEAD'], {env});
            if (!fs.existsSync(path.join(workspace, 'requirements.txt')) ||
                !fs.existsSync(path.join(workspace, 'index.py'))) {
              core.setFailed('Exact source materialization did not produce the expected repository files.');
            }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app index.py
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit pinned runtime requirements
        run: python -m pip_audit -r requirements.txt --progress-spinner off
