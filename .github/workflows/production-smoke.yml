name: Production Smoke Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - "tools/production_smoke.py"
      - "tests/test_continuous_production_smoke.py"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  # A single self-hosted runner uses a shared _temp directory. Keep every
  # self-hosted workflow in one non-cancelling group so an old Worker cannot
  # delete runner command files while the next job is starting.
  group: physics-edu-agent-self-hosted
  cancel-in-progress: false

jobs:
  smoke:
    name: Read-only production health contract
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      SMOKE_BASE_URL: https://physics-edu-agent.vercel.app
      SMOKE_TIMEOUT_SECONDS: "8"
      SMOKE_ATTEMPTS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve expected production version
        shell: powershell
        run: |
          $version = python -c "from app.version import APPLICATION_VERSION; print(APPLICATION_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SMOKE_EXPECT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run bounded read-only smoke checks
        shell: powershell
        run: |
          python tools/production_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-${{ github.run_id }}
          path: production-smoke-results.json
          if-no-files-found: error
          retention-days: 14
