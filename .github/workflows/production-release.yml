name: Controlled Production Release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact main SHA to require before releasing
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .release/production.json

permissions:
  contents: read

concurrency:
  group: physics-edu-agent-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_GsqjHJAXTirB3YVlUto63rma
  VERCEL_PROJECT_ID: prj_YVuUR2a1VFpZQwdXmUwTRpGbE1sL
  VERCEL_CLI_VERSION: 59.15.1
  PRODUCTION_URL: https://physics-edu-agent.vercel.app

jobs:
  release:
    name: Test, stage, verify, promote
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify main release context
        env:
          EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          if [ -n "${EXPECTED_SHA:-}" ] && [ "$EXPECTED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Expected SHA $EXPECTED_SHA but workflow is running $GITHUB_SHA"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            REQUESTED_CODE_SHA="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path(".release/production.json").read_text(encoding="utf-8"))
          print(str(data.get("requested_code_sha") or "").strip())
          PY
          )"
            PARENT_SHA="$(git rev-parse HEAD^)"
            if [ -z "$REQUESTED_CODE_SHA" ] || [ "$REQUESTED_CODE_SHA" != "$PARENT_SHA" ]; then
              echo "::error::Release marker requested_code_sha must equal the release commit parent $PARENT_SHA"
              exit 1
            fi
          fi

      - name: Require Vercel release credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Repository/production environment secret VERCEL_TOKEN is required"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install uv for local Vercel build
        run: python -m pip install --disable-pip-version-check --upgrade uv

      - name: Compile Python
        run: python -m compileall -q app index.py

      - name: Run deterministic regression suite
        run: python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify clean release workspace after Vercel pull
        run: |
          set -euo pipefail
          DIRTY="$(git status --porcelain --untracked-files=all)"
          if [ -n "$DIRTY" ]; then
            printf '%s\n' "$DIRTY"
            echo "::error::Vercel pull changed or created non-ignored repository files"
            exit 1
          fi

      - name: Validate production runtime configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".vercel/.env.production.local")
          if not path.is_file():
              raise SystemExit("Vercel production environment file was not pulled")

          present = set()
          for raw in path.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key = line.split("=", 1)[0].strip()
              if key:
                  present.add(key)

          required = {
              "DATABASE_URL",
              "ADMIN_API_KEY",
              "STUDENT_SESSION_SECRET",
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_ENDPOINT_URL_S3",
              "AWS_REGION",
          }
          missing = sorted(required - present)
          if missing:
              raise SystemExit(
                  "Missing required production environment keys: " + ", ".join(missing)
              )
          print("Required production environment keys are present")
          PY

      - name: Build production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Normalize Vercel-generated dependency metadata
        run: |
          set -euo pipefail
          for generated in pyproject.toml uv.lock; do
            if [ -e "$generated" ] && ! git ls-files --error-unmatch "$generated" >/dev/null 2>&1; then
              rm -f -- "$generated"
            fi
          done

      - name: Verify clean release workspace after build
        run: |
          set -euo pipefail
          DIRTY="$(git status --porcelain --untracked-files=all)"
          if [ -n "$DIRTY" ]; then
            printf '%s\n' "$DIRTY"
            echo "::error::Vercel build changed or created unexpected non-ignored repository files"
            exit 1
          fi

      - name: Stage production deployment without assigning domain
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --skip-domain --yes             --env RELEASE_GIT_REF=main             --env RELEASE_GIT_SHA="$GITHUB_SHA"             --token="$VERCEL_TOKEN")"
          test -n "$DEPLOYMENT_URL"
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify staged health contract
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          set -euo pipefail
          vercel curl /health --deployment "$DEPLOYMENT_URL" > /tmp/health.json
          vercel curl /health/ready --deployment "$DEPLOYMENT_URL" > /tmp/ready.json
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/health.json').read_text())
          ready = json.loads(Path('/tmp/ready.json').read_text())
          if health.get('status') != 'ok':
              raise SystemExit(f"staged /health failed: {health}")
          if ready.get('status') != 'ready':
              raise SystemExit(f"staged /health/ready failed: {ready}")
          print('staged health checks passed')
          PY

      - name: Promote verified deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"

      - name: Verify canonical production
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PRODUCTION_URL/health" > /tmp/prod-health.json
          curl --fail --silent --show-error "$PRODUCTION_URL/health/ready" > /tmp/prod-ready.json
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/prod-health.json').read_text())
          ready = json.loads(Path('/tmp/prod-ready.json').read_text())
          if health.get('status') != 'ok':
              raise SystemExit(f"production /health failed: {health}")
          if ready.get('status') != 'ready':
              raise SystemExit(f"production /health/ready failed: {ready}")
          print('production health checks passed')
          PY

      - name: Release summary
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          {
            echo "### Controlled production release"
            echo "- Commit: $GITHUB_SHA"
            echo "- Staged deployment: $DEPLOYMENT_URL"
            echo "- Production: $PRODUCTION_URL"
            echo "- Gates: env presence + compile + unit tests + staged health + readiness + production smoke"
          } >> "$GITHUB_STEP_SUMMARY"
