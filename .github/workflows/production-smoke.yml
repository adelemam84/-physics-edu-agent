name: Production Smoke Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - "tools/production_smoke.py"
      - "tests/test_continuous_production_smoke.py"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: physics-edu-agent-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Read-only production health contract
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      SMOKE_BASE_URL: https://physics-edu-agent.vercel.app
      SMOKE_TIMEOUT_SECONDS: "8"
      SMOKE_ATTEMPTS: "3"
    steps:
      - name: Materialize exact workflow source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const workspace = process.env.GITHUB_WORKSPACE;
            for (const entry of fs.readdirSync(workspace)) {
              fs.rmSync(path.join(workspace, entry), {
                recursive: true,
                force: true,
                maxRetries: 5,
                retryDelay: 250,
              });
            }
            const env = {
              ...process.env,
              GIT_CONFIG_COUNT: '1',
              GIT_CONFIG_KEY_0: 'http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_0: 'AUTHORIZATION: bearer ' + process.env.SOURCE_TOKEN,
            };
            await exec.exec('git', ['init', workspace], {env});
            await exec.exec('git', ['-C', workspace, 'remote', 'add', 'origin',
              'https://github.com/' + process.env.SOURCE_REPOSITORY + '.git'], {env});
            await exec.exec('git', ['-C', workspace, 'fetch', '--depth=1', 'origin',
              process.env.SOURCE_SHA], {env});
            await exec.exec('git', ['-C', workspace, 'checkout', '--detach', 'FETCH_HEAD'], {env});
            if (!fs.existsSync(path.join(workspace, 'requirements.txt')) ||
                !fs.existsSync(path.join(workspace, 'index.py'))) {
              core.setFailed('Exact source materialization did not produce the expected repository files.');
            }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve expected production version
        shell: powershell
        run: |
          $version = python -c "from app.version import APPLICATION_VERSION; print(APPLICATION_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SMOKE_EXPECT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run bounded read-only smoke checks
        shell: powershell
        run: |
          python tools/production_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-${{ github.run_id }}
          path: production-smoke-results.json
          if-no-files-found: error
          retention-days: 14
