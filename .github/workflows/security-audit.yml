name: Security Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-dependency-audit:
    name: Python dependency CVE audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit pinned runtime requirements
        run: python -m pip_audit -r requirements.txt --progress-spinner off
