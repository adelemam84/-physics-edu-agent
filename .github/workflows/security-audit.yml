name: Security Audit

on:
  schedule:
    - cron: "29 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A single self-hosted runner uses a shared _temp directory. Keep every
  # self-hosted workflow in one non-cancelling group so an old Worker cannot
  # delete runner command files while the next job is starting.
  group: physics-edu-agent-self-hosted
  cancel-in-progress: false

jobs:
  python-dependency-audit:
    name: Python dependency CVE audit
    runs-on: self-hosted
    env:
      PSExecutionPolicyPreference: Bypass
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit pinned runtime requirements
        run: python -m pip_audit -r requirements.txt --progress-spinner off
