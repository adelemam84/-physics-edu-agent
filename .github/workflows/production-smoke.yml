name: Production Smoke Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - "tools/production_smoke.py"
      - "tests/test_continuous_production_smoke.py"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: physics-edu-agent-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Read-only production health contract
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      SMOKE_BASE_URL: https://physics-edu-agent.vercel.app
      SMOKE_TIMEOUT_SECONDS: "8"
      SMOKE_ATTEMPTS: "3"
    steps:
      - name: Materialize exact workflow source
        shell: powershell
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "physics-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.zip"
          $extract = Join-Path $env:RUNNER_TEMP "physics-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null

          $url = "https://api.github.com/repos/$env:SOURCE_REPOSITORY/zipball/$env:SOURCE_SHA"
          & curl.exe --fail --location --silent --show-error --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 `
            -H "Authorization: Bearer $env:SOURCE_TOKEN" `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2022-11-28" `
            -o $archive $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $root = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if (-not $root) { throw "GitHub archive did not contain a source root." }

          Get-ChildItem -Force -Path $env:GITHUB_WORKSPACE | Remove-Item -Recurse -Force -ErrorAction Stop
          Get-ChildItem -Force -Path $root.FullName | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $env:GITHUB_WORKSPACE -Recurse -Force
          }

          if (-not (Test-Path "requirements.txt")) { throw "Workflow archive is missing requirements.txt" }
          if (-not (Test-Path "index.py")) { throw "Workflow archive is missing index.py" }
          Remove-Item $archive -Force -ErrorAction SilentlyContinue
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve expected production version
        shell: powershell
        run: |
          $version = python -c "from app.version import APPLICATION_VERSION; print(APPLICATION_VERSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SMOKE_EXPECT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run bounded read-only smoke checks
        shell: powershell
        run: |
          python tools/production_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-smoke-${{ github.run_id }}
          path: production-smoke-results.json
          if-no-files-found: error
          retention-days: 14
