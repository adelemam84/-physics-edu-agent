name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-edu-agent-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependency-audit:
    name: Python dependency CVE audit
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify local Python
        run: python --version
      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit pinned runtime requirements
        run: python -m pip_audit -r requirements.txt --progress-spinner off
